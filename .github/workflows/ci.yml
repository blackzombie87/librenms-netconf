name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, openssl
          coverage: none
      - name: Lint all PHP files
        run: |
          find src config tests stubs -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          echo "syntax OK on PHP ${{ matrix.php }}"

  style:
    name: Code style (php-cs-fixer, LibreNMS rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/php-cs-fixer check --diff

  workflow:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: raven-actions/actionlint@v2

  analyse:
    name: Static analysis (phpstan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  test:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, openssl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pest

  # Feature suite (tests/Feature, phpunit.feature.xml): needs a LibreNMS installation and its
  # testing database. Pinned to a LibreNMS tag on purpose - bump it deliberately, a plugin
  # that breaks against a newer core should fail here and not on someone's poller.
  # Never executed yet: the repository has no remote (plan R5), so the first push is its
  # first run. Until then dev/README.md makes the Docker run a pre-tag step.
  feature:
    # `env` is not evaluated in a job name, only `matrix` is (GitHub rejects the whole
    # workflow otherwise), so the pinned tag lives in a one-entry matrix
    name: Feature tests (LibreNMS ${{ matrix.librenms }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        librenms: ['26.7.0']
    env:
      LIBRENMS_PATH: ${{ github.workspace }}/librenms
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: librenms_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out the plugin
        uses: actions/checkout@v4
        with:
          path: plugin
      - name: Check out LibreNMS
        uses: actions/checkout@v4
        with:
          repository: librenms/librenms
          ref: ${{ matrix.librenms }}
          path: librenms
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, libxml, openssl, mysqlnd, pdo_mysql, gd, bcmath, intl, zip, snmp
          coverage: none
      # RrdLayoutTest skips without rrdtool, and phpunit.feature.xml fails the run on a skip
      - name: Install rrdtool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rrdtool
      - name: Install the plugin's dependencies
        working-directory: plugin
        run: composer install --no-interaction --no-progress
      - name: Install LibreNMS and add the plugin as a path repository
        working-directory: librenms
        run: |
          cp .env.example .env
          composer config repositories.netconf path ../plugin
          composer install --no-interaction --no-progress
          composer require saffer-it/librenms-netconf:@dev --no-interaction --no-progress
          php artisan key:generate --force
      - name: Migrate the testing database
        working-directory: librenms
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_PORT: '3306'
          DB_TEST_DATABASE: librenms_test
          DB_TEST_USERNAME: root
          DB_TEST_PASSWORD: root
        run: |
          printf 'DB_TEST_HOST=%s\nDB_TEST_PORT=%s\nDB_TEST_DATABASE=%s\nDB_TEST_USERNAME=%s\nDB_TEST_PASSWORD=%s\n' \
            "$DB_TEST_HOST" "$DB_TEST_PORT" "$DB_TEST_DATABASE" "$DB_TEST_USERNAME" "$DB_TEST_PASSWORD" >> .env
          DB_CONNECTION=testing php artisan migrate --force
      - name: Run the feature suite
        working-directory: plugin
        run: vendor/bin/phpunit -c phpunit.feature.xml
