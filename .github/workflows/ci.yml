name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, openssl
          coverage: none
      - name: Lint all PHP files
        run: |
          find src config tests stubs -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null
          echo "syntax OK on PHP ${{ matrix.php }}"

  style:
    name: Code style (php-cs-fixer, LibreNMS rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer validate --strict
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/php-cs-fixer check --diff

  analyse:
    name: Static analysis (phpstan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  test:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, libxml, openssl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/pest
