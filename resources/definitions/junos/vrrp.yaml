# VRRP group state per interface (VRRP-MIB is not polled by LibreNMS).
name: junos-vrrp
# Paths verified on a Junos 22.2 router (2026-09-18). A dual-stack interface reports one row per address
# family with the same interface/group, hence the '/v6' index suffix.
description: VRRP state per interface and group

match:
  os: junos

commands:
  summary:
    cli: show vrrp summary
    optional: true          # "vrrp subsystem not running"

sensors:
  - id: state
    class: state
    command: summary
    rows: //vrrp-interface
    index: concat(interface, '/', group, substring('/v6', 1, 3 * contains(local-interface-address, ':')))
    descr: 'VRRP {row:interface} group {row:group}{row:substring(" (IPv6)", 1, 7 * contains(local-interface-address, ":"))}'
    value: string(vrrp-state)
    group: VRRP
    states:
      Master: { match: '/^master/i', value: 1, generic: 0 }
      Backup: { match: '/^backup/i', value: 2, generic: 0 }
      Init:   { match: '/^init/i',   value: 3, generic: 1 }
      Other:  { match: '/.*/',       value: 4, generic: 2, default: true }

  - id: groups-degraded
    class: count
    command: summary
    index: "'total'"
    descr: VRRP groups neither master nor backup
    value: count(//vrrp-interface[translate(vrrp-state, 'MASTERBACKUP', 'masterbackup') != 'master' and translate(vrrp-state, 'MASTERBACKUP', 'masterbackup') != 'backup'])
    group: VRRP
    limit: 0

metrics:
  - id: group
    command: summary
    rows: //vrrp-interface
    index: concat(interface, '/', group, substring('/v6', 1, 3 * contains(local-interface-address, ':')))
    descr: 'VRRP {row:interface} group {row:group}{row:substring(" (IPv6)", 1, 7 * contains(local-interface-address, ":"))}'
    fields:
      master:   number(translate(vrrp-state, 'MASTER', 'master') = 'master')
      state:
        xpath: string(vrrp-state)
        type: string
      mode:
        xpath: string(vrrp-mode)
        type: string
      vip:
        xpath: string(virtual-ip-address[not(starts-with(., 'fe80'))][1])   # skip the IPv6 link-local VIP
        type: string
      if_state:
        xpath: string(interface-state)
        type: string
